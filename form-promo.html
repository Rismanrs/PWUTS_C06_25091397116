<section class="welcome">
    <div>
        <p class="eyebrow">MANAJEMEN PROMO</p>
        <h1 id="judulForm">Buat Promo</h1>
        <p id="deskripsiForm">Isi informasi promo yang akan dibuat.</p>
    </div>
</section>

<section class="form-section">
    <form id="promoForm" action="simpan-promo.php" method="POST">
        <input type="hidden" id="promo_id" name="id">

        <label for="judul">Nama Promo</label>
        <input
            type="text"
            id="judul"
            name="judul"
            required
        >

        <label for="deskripsi">Deskripsi</label>
        <textarea
            id="deskripsi"
            name="deskripsi"
            required
        ></textarea>

        <label for="diskon">Diskon (%)</label>
        <input
            type="number"
            id="diskon"
            name="diskon"
            min="1"
            max="100"
            step="1"
            required
        >

        <label for="produk">Nama Produk</label>
        <input
            type="text"
            id="produk"
            name="produk"
            required
        >

        <div class="form-row">
            <div>
                <label for="tanggal_mulai">Tanggal Mulai</label>
                <input
                    type="date"
                    id="tanggal_mulai"
                    name="tanggal_mulai"
                    required
                >
            </div>

            <div>
                <label for="tanggal_selesai">Tanggal Selesai</label>
                <input
                    type="date"
                    id="tanggal_selesai"
                    name="tanggal_selesai"
                    required
                >
            </div>
        </div>

        <label for="aktif">Status Promo</label>
        <select id="aktif" name="aktif" required>
            <option value="1">Aktif</option>
            <option value="0">Nonaktif</option>
        </select>

        <div class="form-actions">
            <button type="reset" class="button-secondary">
                Reset
            </button>
            <button type="submit" id="tombolSimpan" class="button">
                Simpan Promo
            </button>
        </div>

        <p id="formMessage"></p>
    </form>
</section>
